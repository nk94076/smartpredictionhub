<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Ranked prediction market platforms</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    background: #fff;
    color: #16181d;
    margin: 0;
    padding: 0;
  }
  .wrap {
    max-width: 1120px;
    margin: 0 auto;
    padding: 56px 24px;
    position: relative;
    overflow: hidden;
  }
  .blob-tl {
    position: absolute; top: -60px; left: -80px;
    width: 220px; height: 220px; border-radius: 50%;
    background: radial-gradient(circle, #ece8fe 0%, rgba(236,232,254,0) 70%);
    z-index: 0;
  }
  .blob-br {
    position: absolute; bottom: -60px; right: -80px;
    width: 220px; height: 220px; border-radius: 50%;
    background: radial-gradient(circle, #e6e9ff 0%, rgba(230,233,255,0) 70%);
    z-index: 0;
  }
  .head {
    position: relative; z-index: 1;
    display: flex; align-items: flex-start; justify-content: space-between; gap: 24px;
    margin-bottom: 32px; flex-wrap: wrap;
  }
  .eyebrow {
    color: #7c5cf5; font-weight: 800; font-size: 12.5px;
    letter-spacing: 0.06em; margin: 0 0 10px;
  }
  h1 { font-size: 34px; font-weight: 800; margin: 0 0 10px; letter-spacing: -0.01em; }
  h1 .accent {
    background: linear-gradient(90deg, #7c5cf5, #4c6fff);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .sub { color: #6b7280; font-size: 15px; margin: 0; max-width: 560px; }

  .badge-unbiased {
    display: flex; align-items: center; gap: 10px;
    background: #f6f5ff; border: 1px solid #eae6ff; border-radius: 12px;
    padding: 12px 16px; min-width: 230px;
  }
  .badge-unbiased .icon {
    width: 34px; height: 34px; border-radius: 8px; background: #ece8fe;
    display: flex; align-items: center; justify-content: center; flex-shrink: 0;
  }
  .badge-unbiased .t1 { font-weight: 700; font-size: 13px; margin: 0; }
  .badge-unbiased .t2 { font-size: 11.5px; color: #8a8f98; margin: 0; }

  .list {
    position: relative; z-index: 1;
    border: 1px solid #eceef2; border-radius: 16px; overflow: hidden;
    background: #fff;
  }
  .row {
    display: grid;
    grid-template-columns: 60px 40px 1fr 190px 130px 170px 44px;
    align-items: center; gap: 18px;
    padding: 20px 22px;
    border-bottom: 1px solid #f0f1f4;
  }
  .row:last-child { border-bottom: none; }
  .row.top { background: linear-gradient(90deg, #f7f5ff, #ffffff); }

  .rankwrap { display: flex; align-items: center; gap: 6px; }
  .rank { font-weight: 800; font-size: 14px; color: #16181d; }
  .crown { font-size: 15px; }

  .badge {
    width: 38px; height: 38px; border-radius: 10px; color: #fff;
    display: flex; align-items: center; justify-content: center;
    font-weight: 800; font-size: 15px;
  }
  .name { font-weight: 700; font-size: 15px; margin: 0 0 3px; }
  .desc { font-size: 12.5px; color: #8a8f98; }

  .score-label { font-size: 11px; color: #9aa0aa; margin: 0 0 4px; display:flex; align-items:center; gap:4px;}
  .score-value { font-weight: 800; font-size: 15px; margin: 0 0 6px; }
  .bar { height: 6px; background: #edeef2; border-radius: 3px; overflow: hidden; width: 150px; }
  .bar-fill { height: 100%; background: linear-gradient(90deg, #7c5cf5, #4c6fff); border-radius: 3px; }

  .vol-label { font-size: 11px; color: #9aa0aa; margin: 0 0 4px; }
  .vol-value { font-weight: 800; font-size: 14.5px; }
  .vol-count { font-size: 11.5px; color: #9aa0aa; margin-top: 2px; }

  .tag {
    display: inline-flex; align-items: center; gap: 6px;
    font-size: 12.5px; font-weight: 700; padding: 7px 12px; border-radius: 8px;
    white-space: nowrap; justify-self: start;
  }
  .tag svg { flex-shrink: 0; }

  .view {
    width: 38px; height: 38px; border-radius: 50%; border: 1px solid #e6e7eb;
    display: flex; align-items: center; justify-content: center; color: #6b7280;
    text-decoration: none; flex-shrink: 0;
  }
  .view:hover { background: #f7f7f9; }

  .footnote { position: relative; z-index: 1; margin-top: 18px; font-size: 12px; color: #9aa0aa; }
  .loading { padding: 48px; text-align: center; color: #9aa0aa; }

  @media (max-width: 860px) {
    .row { grid-template-columns: 40px 34px 1fr; grid-template-areas:
      "rank badge name" "rank badge name" ; }
    .bar { width: 100px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="blob-tl"></div>
  <div class="blob-br"></div>

  <div class="head">
    <div>
      <p class="eyebrow">REVIEWED PLATFORMS</p>
      <h1>Ranked for <span class="accent">real decisions</span></h1>
      <p class="sub">Ranked by live volume pulled directly from each platform's public API. No paid placement — and no invented scores.</p>
    </div>
    <div class="badge-unbiased">
      <div class="icon">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#7c5cf5" stroke-width="2"><path d="M12 2 4 5v6c0 5 3.4 9.4 8 11 4.6-1.6 8-6 8-11V5l-8-3Z"/><path d="m9 12 2 2 4-4"/></svg>
      </div>
      <div>
        <p class="t1">Live &amp; unbiased</p>
        <p class="t2">Real API data. No paid placement.</p>
      </div>
    </div>
  </div>

  <div class="list" id="list">
    <div class="loading">Loading live data&hellip;</div>
  </div>

  <p class="footnote" id="updated"></p>
</div>

<script>
// Platform metadata — factual descriptors + real per-category colors only.
const PLATFORMS = [
  { key: 'kalshi',     name: 'Kalshi',      initial: 'K', color: '#7c5cf5', desc: 'CFTC-regulated US exchange',
    tag: 'CFTC regulated', tagBg: '#e7f8ef', tagFg: '#1a9a5c',
    tagIcon: '<path d="M12 2 4 5v6c0 5 3.4 9.4 8 11 4.6-1.6 8-6 8-11V5l-8-3Z"/>' },
  { key: 'polymarket', name: 'Polymarket',  initial: 'P', color: '#4c6fff', desc: 'Crypto-settled, global access',
    tag: 'Global access', tagBg: '#eaf1ff', tagFg: '#2f6fed',
    tagIcon: '<circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a15 15 0 0 1 0 18 15 15 0 0 1 0-18Z"/>' },
  { key: 'predictit',  name: 'PredictIt',   initial: 'P', color: '#e0507a', desc: 'US politics-focused exchange',
    tag: 'US politics', tagBg: '#fdeaf0', tagFg: '#c23b64',
    tagIcon: '<path d="M4 21V10M12 21V3M20 21v-7"/>' },
  { key: 'manifold',   name: 'Manifold',    initial: 'M', color: '#f0a63a', desc: 'Play-money social forecasting',
    tag: 'Play money', tagBg: '#fdf2e2', tagFg: '#b5751a',
    tagIcon: '<circle cx="12" cy="12" r="8"/><path d="M9.5 9.5c0-1.4 1-2.5 2.5-2.5s2.5 1 2.5 2.2c0 1.6-2.5 1.8-2.5 3.8M12 17h.01"/>' },
  { key: 'limitless',  name: 'Limitless',   initial: 'L', color: '#2fb3a3', desc: 'On-chain markets on Base',
    tag: 'On-chain', tagBg: '#e4f7f4', tagFg: '#128574',
    tagIcon: '<path d="M12 2v20M2 12h20"/><circle cx="12" cy="12" r="9"/>' },
  { key: 'sxbet',      name: 'SX Bet',      initial: 'S', color: '#6b7280', desc: 'On-chain sports betting exchange',
    tag: 'Sports', tagBg: '#f1f2f5', tagFg: '#4b5563',
    tagIcon: '<circle cx="12" cy="12" r="9"/><path d="m8 9 4 3 4-3M12 12v6"/>' },
  { key: null, name: 'Predict Fun',    initial: 'P', color: '#c7c9d1', desc: 'BNB Chain — API needs a key',
    tag: 'No public API', tagBg: '#f4f4f6', tagFg: '#9aa0aa', tagIcon: '<circle cx="12" cy="12" r="9"/><path d="M12 8v5M12 16h.01"/>' },
  { key: null, name: 'OPINION',        initial: 'O', color: '#c7c9d1', desc: 'No developer API docs found',
    tag: 'No public API', tagBg: '#f4f4f6', tagFg: '#9aa0aa', tagIcon: '<circle cx="12" cy="12" r="9"/><path d="M12 8v5M12 16h.01"/>' },
  { key: null, name: 'Drift Protocol', initial: 'D', color: '#c7c9d1', desc: 'Solana on-chain — no REST docs found',
    tag: 'No public API', tagBg: '#f4f4f6', tagFg: '#9aa0aa', tagIcon: '<circle cx="12" cy="12" r="9"/><path d="M12 8v5M12 16h.01"/>' },
  { key: null, name: 'Novig',          initial: 'N', color: '#c7c9d1', desc: 'Mobile sportsbook app — no public API',
    tag: 'No public API', tagBg: '#f4f4f6', tagFg: '#9aa0aa', tagIcon: '<circle cx="12" cy="12" r="9"/><path d="M12 8v5M12 16h.01"/>' },
];

// Point this at your own api.php (src=kalshi|polymarket|predictit|manifold|sxbet|limitless)
const API_BASE = '/api.php?src=';

function fmtVolume(n) {
  if (!n || n <= 0) return '—';
  if (n >= 1e9) return '$' + (n / 1e9).toFixed(2) + 'B';
  if (n >= 1e6) return '$' + (n / 1e6).toFixed(1) + 'M';
  if (n >= 1e3) return '$' + (n / 1e3).toFixed(1) + 'K';
  return '$' + n.toFixed(0);
}

async function fetchWithTimeout(url, ms) {
  const ctrl = new AbortController();
  const t = setTimeout(() => ctrl.abort(), ms);
  try {
    const res = await fetch(url, { signal: ctrl.signal });
    return res;
  } finally {
    clearTimeout(t);
  }
}

async function fetchOne(p) {
  if (!p.key) return { ...p, ok: false, noApi: true, totalVolume: 0 };
  // one retry, since shared hosting can be slow/flaky on the first hit
  for (let attempt = 0; attempt < 2; attempt++) {
    try {
      const res = await fetchWithTimeout(API_BASE + p.key, 20000);
      const data = await res.json();
      if (!Array.isArray(data) || data.length === 0) {
        if (attempt === 0) continue;
        return { ...p, ok: false, totalVolume: 0 };
      }
      let totalVolume = 0;
      for (const m of data) totalVolume += Number(m.volume || 0);
      return { ...p, totalVolume, marketCount: data.length, ok: true };
    } catch (e) {
      if (attempt === 0) continue;
      return { ...p, ok: false, totalVolume: 0 };
    }
  }
  return { ...p, ok: false, totalVolume: 0 };
}

async function loadAll() {
  // Sequential, not Promise.all — shared hosting (e.g. Hostinger) chokes when
  // 6 curl-backed PHP requests hit it at the same instant, so we go one at a time.
  const results = [];
  for (const p of PLATFORMS) {
    results.push(await fetchOne(p));
  }

  results.sort((a, b) => (b.totalVolume || 0) - (a.totalVolume || 0));
  const maxVolume = Math.max(...results.map((r) => r.totalVolume || 0), 1);

  const list = document.getElementById('list');
  list.innerHTML = '';

  results.forEach((p, i) => {
    const row = document.createElement('div');
    row.className = 'row' + (i === 0 && p.ok ? ' top' : '');
    const barPct = p.ok ? Math.max(4, Math.round((p.totalVolume / maxVolume) * 100)) : 0;

    row.innerHTML = `
      <div class="rankwrap">
        ${i === 0 && p.ok ? '<span class="crown">&#128081;</span>' : ''}
        <span class="rank">#${i + 1}</span>
      </div>
      <div class="badge" style="background:${p.color}">${p.initial}</div>
      <div>
        <p class="name">${p.name}</p>
        <p class="desc">${p.desc}</p>
      </div>
      <div>
        <p class="score-label">Live volume share</p>
        <p class="score-value">${p.ok ? fmtVolume(p.totalVolume) : '—'}</p>
        <div class="bar"><div class="bar-fill" style="width:${barPct}%"></div></div>
      </div>
      <div>
        <p class="vol-label">Markets tracked</p>
        <p class="vol-value">${p.ok ? p.marketCount : (p.noApi ? '—' : 'unavailable')}</p>
      </div>
      <div class="tag" style="background:${p.tagBg};color:${p.tagFg}">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="${p.tagFg}" stroke-width="2">${p.tagIcon}</svg>
        ${p.tag}
      </div>
      <a class="view" href="#" title="View markets">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
      </a>
    `;
    list.appendChild(row);
  });

  document.getElementById('updated').textContent = 'Last updated ' + new Date().toLocaleString();
}

loadAll();
</script>
</body>
</html>
