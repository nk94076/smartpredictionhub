# Smart Prediction Hub — extra rules for the CloudPanel (nginx) vhost.
# nginx IGNORES .htaccess, so private folders must be blocked here.
#
# CloudPanel → Sites → smartpredictionhub.com → Vhost: paste ALL of this inside the
# `server { ... }` block that listens on 443, right after the `root ...;` line,
# BEFORE every other `location` block. Save. (Replace the older copy if you pasted one before.)
# Local equivalent for testing: php -S 127.0.0.1:8080 deploy/router.php

# ---- 1. private folders -------------------------------------------------------
# `^~` beats every regex location (CloudPanel's static-file and \.php$ blocks),
# so these cannot be bypassed via .json/.php/.js file extensions.
location ^~ /app/            { deny all; return 404; }
location ^~ /includes/       { deny all; return 404; }
location ^~ /deploy/         { deny all; return 404; }
location ^~ /admin/includes/ { deny all; return 404; }
location ^~ /user/includes/  { deny all; return 404; }
location ^~ /.git            { deny all; return 404; }
location ~ /\.(?!well-known) { deny all; return 404; }
location ~* \.(sql|md|log|ini|bak|env|sh|py|zip|lock)$ { deny all; return 404; }
location = /test.php         { deny all; return 404; }

# CMS uploads: images only, never run code from here
location ^~ /uploads/ {
    location ~* \.(php\d?|phtml|phar|html?|svg|js)$ { deny all; return 404; }
    expires 30d;
    add_header Cache-Control "public";
}

# ---- 2. old links → 301 to the clean address ------------------------------------
if ($request_uri ~ "^/event\.php\?id=([A-Za-z0-9_-]+)$")  { return 301 /event/$1; }
if ($request_uri ~ "^/markets\.php\?category=([a-z]+)$")  { return 301 /markets/$1; }
if ($request_uri ~ "^/index\.(?:html|php)(\?.*)?$")       { return 301 /$1; }
if ($request_uri ~ "^/(?!(?:api|page|posts|article|sitemap)\.php)((?:reviews/)?[A-Za-z0-9_-]+)\.(?:php|html)(\?.*)?$") { return 301 /$1$2; }

# ---- 3. clean address → script ---------------------------------------------------
rewrite ^/event/([A-Za-z0-9_-]+)/?$ /event.php?id=$1 last;
rewrite ^/markets/([a-z]+)/?$      /markets.php?category=$1 last;
rewrite ^/(blog|news)/?$                       /posts.php?type=$1 last;
rewrite ^/(blog|news)/category/([a-z0-9-]+)/?$ /posts.php?type=$1&category=$2 last;
rewrite ^/(blog|news)/([a-z0-9-]+)/?$          /article.php?type=$1&slug=$2 last;
rewrite ^/sitemap\.xml$ /sitemap.php last;
rewrite ^/$ /page.php?p=/ last;
if (-f $document_root$uri.php)  { rewrite ^ $uri.php last; }
# designed .html pages and CMS pages go through page.php (CMS edits, header/footer, SEO)
if (-f $document_root$uri.html) { rewrite ^ /page.php?p=$uri last; }
if (!-e $request_filename)      { rewrite ^ /page.php?p=$uri last; }

gzip on;
gzip_types application/json text/css application/javascript image/svg+xml application/xml;
