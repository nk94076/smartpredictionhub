# Smart Prediction Hub — extra rules for the CloudPanel (nginx) vhost.
# CloudPanel uses nginx, which IGNORES .htaccess files, so the folders those files
# protected on Hostinger must be blocked here.
#
# CloudPanel → Sites → smartpredictionhub.com → Vhost: paste these lines inside the
# `server { ... }` block that listens on 443, ABOVE the `location ~ \.php$ {` block. Save.

# private code, cache, sessions, deploy files, git
location ~ ^/(app|includes|deploy)(/|$) { deny all; return 404; }
location ~ ^/(admin|user)/includes(/|$) { deny all; return 404; }
location ~ /\.(?!well-known) { deny all; return 404; }
location ~* \.(sql|md|log|ini|bak|env|sh|py)$ { deny all; return 404; }
location = /test.php { deny all; return 404; }

gzip on;
gzip_types application/json text/css application/javascript image/svg+xml;
